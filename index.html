*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.6}

.lang-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}

.top-bar{padding:16px 16px 0;margin-bottom:0}

.tab.active{background:var(--surface2);color:#f0f4ff}
.tab:hover:not(.active){color:#f0f4ff}
.bottom-nav{display:none}
.page-wrap{padding:0 16px 16px}
.page{display:none}.page.active{display:block}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{text-align:center}.stat-num{font-size:28px;font-weight:700;line-height:1;margin-bottom:3px}.stat-label{font-size:11px;color:var(--muted)}

.btn-red{background:rgba(239,68,68,.2);color:#fca5a5;border-color:rgba(239,68,68,.4)}

@keyframes flash-fast{0%,100%{filter:brightness(1)}50%{filter:brightness(2.5) drop-shadow(0 0 10px #ef4444)}}

function T(){ return LANGS[currentLang]; }

// ── 渲染導覽列 ────────────────────────────────────────
function renderNav(){
  const t=T();
  document.getElementById('hdr-title').textContent=t.title;
  document.getElementById('hdr-sub').textContent=t.subtitle;
  document.getElementById('page-title').textContent=t.title;
  document.documentElement.lang={zh:'zh-TW',en:'en',vi:'vi',ja:'ja',ko:'ko'}[currentLang]||'zh-TW';

  const topTabs=document.getElementById('top-tabs');
  topTabs.innerHTML=TAB_KEYS.map((k,i)=>
    `<button class="tab ${i===0&&currentLang===currentLang?'':''}${document.getElementById('page-'+k).classList.contains('active')?'active':''}" onclick="switchTab('${k}')">${t.tabs[i]}</button>`
  ).join('');

  const bnav=document.getElementById('bottom-nav');
  bnav.innerHTML=TAB_KEYS.map((k,i)=>{
    const parts=t.bnav[i].split('\n');
    return `<button class="bnav-btn ${document.getElementById('page-'+k).classList.contains('active')?'active':''}" onclick="switchTab('${k}')"><span class="bnav-icon">${parts[0]}</span>${parts[1]||''}</button>`;
  }).join('');
}

// ── Tab 切換 ──────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  renderNav();
  renderPage(name);
  if(name==='monitor'&&!chartsInited) setTimeout(initCharts,100);
  if(name==='escape'&&!mapsInited['home']) setTimeout(initEscapeMaps,150);
  else if(name==='escape') setTimeout(()=>{Object.values(escapeMaps).forEach(m=>m?.invalidateSize());},100);
  if(name==='report') setTimeout(()=>{initReportMap();if(reportMapInst)reportMapInst.invalidateSize();},150);
}

// ── 各頁面渲染函式 ────────────────────────────────────
function renderPage(name){
  switch(name){
    case 'flow': renderFlow(); break;
    case 'control': renderControl(); break;
    case 'escape': renderEscape(); break;
    case 'report': renderReport(); break;
    case 'ai': renderAI(); break;
    case 'monitor': renderMonitor(); break;
    case 'sources': renderSources(); break;
  }
}

function applyLevel(level){
  const t=T();
  Object.entries(MOCK_LIGHTS).forEach(([id,l])=>{
    if(l.zone==='shelter'){
      if(['red','breach'].includes(level)){l.color='green';l.flash=false;l.status='shelter';}
      else{l.color='white';l.flash=false;l.status='normal';}
    } else {
      const m={monitor:{color:'blue',flash:false,flash_speed:null,status:'alert'},
               yellow:{color:'amber',flash:true,flash_speed:'slow',status:'alert'},
               red:{color:'red',flash:true,flash_speed:'fast',status:'alert'},
               breach:{color:'red',flash:true,flash_speed:'urgent',status:'alert'},
               clear:{color:'white',flash:false,flash_speed:null,status:'normal'}};
      Object.assign(l,m[level]);
    }
  });
  const ld=T().ctrl_levels[[
    'monitor','yellow','red','breach','clear'
  ].indexOf(level)];
  MOCK_LOGS.unshift({timestamp:new Date().toISOString(),level,label:T().ctrl_levels[[0,1,2,3].indexOf(['monitor','yellow','red','breach'].indexOf(level))]?.label||T().ctrl_standby,affected:7});
}

function renderLights(){
  const g=document.getElementById('lights-grid');
  if(!g) return;
  const t=T();
  const ZONE_LABEL={'upstream':t.zone_upstream,'downtown':t.zone_downtown,'shelter':t.zone_shelter};
  let alertCount=0;
  const lightNames=t.ctrl_lights_opts.slice(1);
  g.innerHTML=Object.entries(MOCK_LIGHTS).map(([id,l],i)=>{
    if(l.status==='alert')alertCount++;
    const fc=l.flash?`flash-${l.flash_speed}`:'';
    const tag=l.status==='shelter'?t.light_shelter:l.status==='alert'?t.light_alert:t.light_normal;
    const cls=l.status==='shelter'?'tag-shelter':l.status==='alert'?'tag-alert':'tag-normal';
    return `<div class="light-card zone-${l.zone}"><span class="light-icon ${fc}">${COLOR_ICON[l.color]||'🤍'}</span>
    <div class="light-name">${lightNames[i]||id}</div>
    <div class="light-zone">${ZONE_LABEL[l.zone]||l.zone}</div>
    <span class="light-tag ${cls}">${tag}</span></div>`;
  }).join('');
  const ac=document.getElementById('alert-count');
  const nc=document.getElementById('normal-count');
  if(ac) ac.textContent=alertCount;
  if(nc) nc.textContent=7-alertCount;
}

function manualControl(){
  const lightId=document.getElementById('manual-light').value;
  const color=document.getElementById('manual-color').value;
  const flash=document.getElementById('manual-flash').value;
  const flashBool=flash!=='none';
  const targets=lightId==='all'?Object.keys(MOCK_LIGHTS):[lightId];
  targets.forEach(id=>{if(MOCK_LIGHTS[id]){MOCK_LIGHTS[id].color=color;MOCK_LIGHTS[id].flash=flashBool;MOCK_LIGHTS[id].flash_speed=flash==='none'?null:flash;MOCK_LIGHTS[id].status=color==='white'?'normal':'alert';}});
  renderLights();
  MOCK_LOGS.unshift({timestamp:new Date().toISOString(),level:'manual',label:'Manual',affected:targets.length});
  renderLogs();
  showToast('🔧 OK');
}

async function runReplay(){
  for(const level of ['monitor','yellow','red','breach']){
    applyLevel(level);
    MOCK_LOGS.unshift({timestamp:new Date().toISOString(),level,label:T().ctrl_levels[['monitor','yellow','red','breach'].indexOf(level)].label,affected:7});
    renderLights();renderLogs();
    showToast('▶ '+T().ctrl_levels[['monitor','yellow','red','breach'].indexOf(level)].label);
    await new Promise(r=>setTimeout(r,1800));
  }
}

function locateAndFindShelter(){
  const el=document.getElementById('nearest-shelter');
  el.textContent='⏳...';
  if(!navigator.geolocation){el.textContent='⚠️ GPS not available';return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    let nearest=SHELTERS[0],minDist=999;
    SHELTERS.forEach(s=>{const d=Math.sqrt((s.lat-lat)**2+(s.lng-lng)**2);if(d<minDist){minDist=d;nearest=s;}});
    el.innerHTML=`<strong style="color:#86efac">${nearest.name}</strong> (${(minDist*111).toFixed(1)} km)`;
    const mapEl=document.getElementById('shelter-map');
    mapEl.style.display='block';
    if(shelterMapInst){shelterMapInst.remove();}
    shelterMapInst=L.map('shelter-map').setView([lat,lng],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(shelterMapInst);
    L.marker([lat,lng]).addTo(shelterMapInst).bindPopup('You').openPopup();
    SHELTERS.forEach(s=>{L.marker([s.lat,s.lng],{icon:L.divIcon({html:'🏫',className:'',iconSize:[24,24]})}).addTo(shelterMapInst).bindPopup(s.name);});
    L.polyline([[lat,lng],[nearest.lat,nearest.lng]],{color:'#22c55e',weight:3}).addTo(shelterMapInst);
  },()=>{el.textContent='⚠️ GPS error';},{timeout:10000,enableHighAccuracy:true});
}

    const ts=new Date(r.timestamp).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const coordLink=r.coords?`<a href="https://maps.google.com/?q=${r.coords.lat},${r.coords.lng}" target="_blank" class="lnk" style="margin-left:6px">📍</a>`:'';
    return `<div style="display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start">
      <span style="font-size:10px;color:#9daacc;min-width:50px;margin-top:3px">${ts}</span>
      <span style="padding:2px 8px;border-radius:6px;background:rgba(${sColor[r.status]||'139,92,246'},.2);color:rgb(${sTxt[r.status]||'221,214,254'});font-size:10px;font-weight:700;flex-shrink:0">${t.rpt_status_labels[r.status]||r.status}</span>
      <div style="flex:1;font-size:12px;color:#b0bedd"><div>${r.name} ${r.location}${coordLink}</div>${r.triage?`<div style="font-size:10px;color:#9daacc">${r.triage}</div>`:''}</div>
    </div>`;
  }).join('');
}

// ── AI 影像辨識 ───────────────────────────────────────
let currentImageBase64=null;
function handleImageUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    currentImageBase64=ev.target.result.split(',')[1];
    document.getElementById('img-preview').src=ev.target.result;
    document.getElementById('img-preview-wrap').style.display='block';
    document.getElementById('ai-result-wrap').style.display='none';
  };
  reader.readAsDataURL(file);
}
function clearImage(){
  currentImageBase64=null;
  document.getElementById('img-preview-wrap').style.display='none';
  document.getElementById('ai-result-wrap').style.display='none';
  document.getElementById('img-upload').value='';
}
async function analyzeImage(){
  if(!currentImageBase64){showToast('⚠️ No image');return;}
  document.getElementById('ai-loading').style.display='block';
  document.getElementById('ai-result-wrap').style.display='none';
  try{
    const response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:currentImageBase64}},
        {type:'text',text:'Analyze this disaster photo. Output ONLY JSON: {"hazard_type":"flooding/landslide/road damage/building damage/none","severity":"low/medium/high/critical","water_depth_estimate":"if applicable","description":"20 chars","immediate_action":"brief","safe_for_evacuation":true/false}'}
      ]}]})
    });
    const data=await response.json();
    const text=data.content?.map(c=>c.text||'').join('');
    let parsed;try{parsed=JSON.parse(text.replace(/```json|```/g,'').trim());}catch{parsed={hazard_type:'Unknown',severity:'unknown',description:'Parse error',safe_for_evacuation:false};}
    document.getElementById('ai-loading').style.display='none';
    document.getElementById('ai-result-wrap').style.display='block';
    const sc={low:'#86efac',medium:'#fde68a',high:'#fca5a5',critical:'#ef4444',unknown:'#9daacc'};
    document.getElementById('ai-summary').innerHTML=`<strong style="color:#f0f4ff">${parsed.hazard_type}</strong> · <span style="color:${sc[parsed.severity]}">${parsed.severity}</span><br>${parsed.description}<br><span style="font-size:12px;font-weight:700;color:${parsed.safe_for_evacuation?'#86efac':'#fca5a5'}">${parsed.safe_for_evacuation?'✅':'🚫'}</span>`;
    document.getElementById('ai-json').textContent=JSON.stringify(parsed,null,2);
    if(parsed.hazard_type){const sel=document.getElementById('ai-hazard-manual');if(sel)for(let i=0;i<sel.options.length;i++){if(sel.options[i].value===parsed.hazard_type){sel.selectedIndex=i;break;}}}
    if(parsed.severity){const sel=document.getElementById('ai-severity-manual');if(sel)for(let i=0;i<sel.options.length;i++){if(sel.options[i].value===parsed.severity){sel.selectedIndex=i;break;}}}
  }catch(err){
    document.getElementById('ai-loading').style.display='none';
    document.getElementById('ai-result-wrap').style.display='block';
    const demo={hazard_type:'積水',severity:'medium',water_depth_estimate:'30-50cm',description:'Demo result',immediate_action:'Use Hwy 9',safe_for_evacuation:false};
    document.getElementById('ai-summary').innerHTML=`<span style="color:#fde68a">⚠️ Demo mode</span><br>${demo.hazard_type} · ${demo.severity}`;
    document.getElementById('ai-json').textContent=JSON.stringify(demo,null,2);
  }
}

function getAiLocation(){
  const status=document.getElementById('ai-location-status');
  status.textContent='⏳...';status.style.color='#9daacc';
  if(!navigator.geolocation){status.textContent='⚠️ N/A';status.style.color='#fca5a5';return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude.toFixed(6),lng=pos.coords.longitude.toFixed(6);
    aiCoords={lat,lng};status.textContent='✅';status.style.color='#86efac';
    const wrap=document.getElementById('ai-coords-wrap');
    if(wrap){wrap.style.display='block';document.getElementById('ai-coords-text').textContent=`${lat}, ${lng}`;}
    const cur=document.getElementById('ai-location-text')?.value;
    if(cur==='') document.getElementById('ai-location-text').value=`GPS (${lat}, ${lng})`;
  },()=>{status.textContent='⚠️ error';status.style.color='#fca5a5';},{timeout:10000,enableHighAccuracy:true});
}

function submitManualReport(){
  const loc=document.getElementById('ai-location-text')?.value;
  const hazard=document.getElementById('ai-hazard-manual')?.value;
  const severity=document.getElementById('ai-severity-manual')?.value;
  const note=document.getElementById('ai-note-manual')?.value;
  if(!loc||!hazard){showToast('⚠️ Required');return;}
  const manual={hazard_type:hazard,severity:severity||'unknown',description:note||hazard,immediate_action:['high','critical'].includes(severity)?'Do not enter':'Proceed carefully',safe_for_evacuation:!['critical','high'].includes(severity),location:loc,coords:aiCoords,source:'Manual',timestamp:new Date().toISOString()};
  document.getElementById('ai-result-wrap').style.display='block';
  document.getElementById('ai-summary').innerHTML=`<strong style="color:#f0f4ff">${hazard}</strong> · ${severity}<br><span style="font-size:11px;color:#9daacc">${loc}</span>`;
  document.getElementById('ai-json').textContent=JSON.stringify(manual,null,2);
  showToast('✅ OK');
}

function markOnMap(){
  const mapEl=document.getElementById('ai-map');
  mapEl.style.display='block';
  if(aiMapInst){aiMapInst.remove();}
  const hazard=document.getElementById('ai-hazard-manual')?.value||'?';
  const severity=document.getElementById('ai-severity-manual')?.value||'unknown';
  const loc=document.getElementById('ai-location-text')?.value||'?';
  const lat=aiCoords?parseFloat(aiCoords.lat):23.6355+(Math.random()-.5)*.01;
  const lng=aiCoords?parseFloat(aiCoords.lng):121.4098+(Math.random()-.5)*.01;
  const sc={low:'#86efac',medium:'#fde68a',high:'#fca5a5',critical:'#ef4444',unknown:'#9daacc'};
  aiMapInst=L.map('ai-map').setView([lat,lng],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(aiMapInst);
  L.circleMarker([lat,lng],{radius:16,color:sc[severity]||'#9daacc',fillColor:sc[severity]||'#9daacc',fillOpacity:.35,weight:2}).addTo(aiMapInst).bindPopup(`⚠️ ${hazard}・${severity}<br>📍 ${loc}`).openPopup();
  showToast('📍 OK');
}

function copyJson(){
  const text=document.getElementById('ai-json')?.textContent;
  if(text) navigator.clipboard?.writeText(text).then(()=>showToast('📋 OK'));
}

// ── Toast ─────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
